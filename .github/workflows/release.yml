name: Test and publish plugin

on:
  push:
    branches: [main]
    paths:
      - '.github/release.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare real mdevctl CLI contract tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          task_cli_tools=$(mktemp -d "$RUNNER_TEMP/vgpu-mdevctl.XXXXXXXX")
          (cd "$task_cli_tools" && apt-get download mdevctl)
          shopt -s nullglob
          task_cli_packages=("$task_cli_tools"/mdevctl_*_amd64.deb)
          test "${#task_cli_packages[@]}" -eq 1
          dpkg-deb --extract "${task_cli_packages[0]}" "$task_cli_tools/root"
          test -x "$task_cli_tools/root/usr/bin/mdevctl"
          printf 'MDEVCTL_BIN=%s\nVGPU_TEST_BWRAP_SUDO=1\n' "$task_cli_tools/root/usr/bin/mdevctl" >> "$GITHUB_ENV"
      - name: Hardware-free tests
        run: bash tests/run-tests.sh

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, publish and verify public plugin assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-github.py
